name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build version.dll
        shell: cmd
        run: _build.bat ci

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path .\dist\version.dll)) {
            throw "dist\version.dll was not produced."
          }

      - name: Run tests
        shell: cmd
        run: _tests.bat ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: version-dll
          path: dist/version.dll
          if-no-files-found: error
          retention-days: 14

  cppcheck:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Cppcheck
        shell: cmd
        run: choco install cppcheck -y --no-progress

      - name: Run Cppcheck
        shell: cmd
        run: |
          "C:\Program Files\Cppcheck\cppcheck.exe" --enable=warning,style,performance,portability --std=c11 --platform=win64 --suppress=missingIncludeSystem --inline-suppr --error-exitcode=1 src
